name: Tercis full staging recovery verification
on:
  workflow_dispatch:
    inputs:
      source_staging_ref:
        description: 'Confirm source STAGING Supabase ref'
        required: true
        type: string
      recovery_staging_ref:
        description: 'Confirm DIFFERENT recovery STAGING Supabase ref'
        required: true
        type: string
      restored_snapshot:
        description: 'Confirm backup was restored to the empty recovery project and writes were paused'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  verify-independent-full-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      TERCIS_STAGING_PROJECT_REF: ${{ secrets.TERCIS_STAGING_PROJECT_REF }}
      TERCIS_RECOVERY_STAGING_PROJECT_REF: ${{ secrets.TERCIS_RECOVERY_STAGING_PROJECT_REF }}
      TERCIS_STAGING_CONFIRM: ${{ inputs.source_staging_ref }}
      TERCIS_RECOVERY_STAGING_CONFIRM: ${{ inputs.recovery_staging_ref }}
      TERCIS_STAGING_DATABASE_URL: ${{ secrets.TERCIS_STAGING_DATABASE_URL }}
      TERCIS_RECOVERY_STAGING_DATABASE_URL: ${{ secrets.TERCIS_RECOVERY_STAGING_DATABASE_URL }}
      TERCIS_STAGING_URL: ${{ secrets.TERCIS_STAGING_URL }}
      TERCIS_RECOVERY_STAGING_URL: ${{ secrets.TERCIS_RECOVERY_STAGING_URL }}
      TERCIS_STAGING_SERVICE_ROLE_KEY: ${{ secrets.TERCIS_STAGING_SERVICE_ROLE_KEY }}
      TERCIS_RECOVERY_STAGING_SERVICE_ROLE_KEY: ${{ secrets.TERCIS_RECOVERY_STAGING_SERVICE_ROLE_KEY }}
    steps:
      - name: Reject unconfirmed target or missing full restore
        shell: bash
        env:
          VERIFIED_RESTORE: ${{ inputs.restored_snapshot }}
        run: |
          set -euo pipefail
          test "$VERIFIED_RESTORE" = "true"
          test -n "$TERCIS_STAGING_PROJECT_REF"
          test -n "$TERCIS_RECOVERY_STAGING_PROJECT_REF"
          test "$TERCIS_STAGING_PROJECT_REF" != "$TERCIS_RECOVERY_STAGING_PROJECT_REF"
          test "$TERCIS_STAGING_CONFIRM" = "$TERCIS_STAGING_PROJECT_REF"
          test "$TERCIS_RECOVERY_STAGING_CONFIRM" = "$TERCIS_RECOVERY_STAGING_PROJECT_REF"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify all application/Auth/Storage metadata tables and RLS policies
        run: bash scripts/staging-full-db-recovery-audit.sh
      - name: Verify all Storage buckets and objects with SHA-256
        run: node scripts/staging-full-storage-recovery-audit.mjs
